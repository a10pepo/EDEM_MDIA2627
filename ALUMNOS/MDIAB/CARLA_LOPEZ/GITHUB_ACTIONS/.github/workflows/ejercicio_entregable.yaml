name: Pipeline de Datos Seguro y Automatizado

on:
  workflow_dispatch:
    inputs:
      tests_seguridad:
        description: "¿Ejecutar los tests de seguridad?"
        type: choice
        options:
          - "si"
          - "no"
        default: "si"
        required: true

jobs:
  ci_seguridad:
    name: CI y Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar JSON
        run: python -m json.tool ventas.json > /dev/null

      - name: Tests de seguridad
        if: ${{ inputs.tests_seguridad == 'si' }}
        run: python seguridad.py

  procesamiento:
    name: Procesamiento
    needs: ci_seguridad
    runs-on: ubuntu-latest

    strategy:
      matrix:
        entorno: [staging, production]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar reporte
        run: echo "Procesamiento de ventas en ${{ matrix.entorno }}" > reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  notificacion:
    name: Notificacion de exito
    needs: [ci_seguridad, procesamiento]
    runs-on: ubuntu-latest

    steps:
      - name: Simular notificacion a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "ERROR: El secreto no esta configurado"
            exit 1
          fi
          echo "Notificacion simulada a $DISCORD_WEBHOOK"