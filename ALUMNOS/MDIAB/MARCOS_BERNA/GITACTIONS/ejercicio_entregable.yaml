name: Pipeline de Datos Seguro y Automatizado

# 1. Activación manual con opción de ejecutar los Tests de Seguridad
on:
  workflow_dispatch:
    inputs:
      ejecutar_tests_seguridad:
        description: "¿Ejecutar los Tests de Seguridad?"
        required: true
        type: choice
        options:
          - "sí"
          - "no"
        default: "sí"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Job 1: CI & Seguridad
  # ---------------------------------------------------------------
  ci-seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar que ventas.json es un JSON válido
        run: |
          if python -m json.tool ventas.json > /dev/null; then
            echo "✅ ventas.json es un JSON válido"
          else
            echo "❌ ventas.json NO es un JSON válido"
            exit 1
          fi

      - name: Escaneo de seguridad (búsqueda de claves API expuestas)
        if: ${{ inputs.ejecutar_tests_seguridad == 'sí' }}
        run: python scripts/security_scan.py .

      - name: Aviso de escaneo omitido
        if: ${{ inputs.ejecutar_tests_seguridad != 'sí' }}
        run: echo "⏭️ El usuario eligió NO ejecutar los Tests de Seguridad."

  # ---------------------------------------------------------------
  # Job 2: Procesamiento (Matrix staging / production)
  # ---------------------------------------------------------------
  procesamiento:
    name: Procesamiento (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    needs: ci-seguridad
    strategy:
      fail-fast: false
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar reporte para ${{ matrix.entorno }}
        env:
          ENTORNO: ${{ matrix.entorno }}
        run: python scripts/generar_reporte.py ventas.json "$ENTORNO"

      - name: Mostrar reporte generado
        run: cat "reporte_${{ matrix.entorno }}.txt"

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 3: Notificación de Éxito
  # ---------------------------------------------------------------
  notificacion:
    name: Notificación de Éxito
    runs-on: ubuntu-latest
    needs: [ci-seguridad, procesamiento]
    if: ${{ success() }}
    steps:
      - name: Simular envío de notificación a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.SECRET_MARCOS }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ El secreto DISCORD_WEBHOOK no está configurado."
            exit 1
          fi
          echo "📣 Enviando notificación de éxito a Discord..."
          echo "Webhook (GitHub lo enmascara automáticamente): $DISCORD_WEBHOOK"
          echo "Mensaje: ✅ Pipeline '${{ github.workflow }}' (run #${{ github.run_number }}) completado con éxito."
          echo "Tests de seguridad ejecutados: ${{ inputs.ejecutar_tests_seguridad }}"
