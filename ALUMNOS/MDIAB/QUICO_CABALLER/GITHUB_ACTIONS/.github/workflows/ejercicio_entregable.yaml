name: Pipeline de Datos Seguro y Automatizado

on:
  workflow_dispatch:
    inputs:
      ejecutar_tests_seguridad:
        description: "¿Ejecutar los Tests de Seguridad?"
        type: choice
        options: ["sí", "no"]

jobs:
  # ---------------------------------------------------------------
  # JOB 1: CI & Seguridad
  # ---------------------------------------------------------------
  ci-seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar que ventas.json es un JSON válido
        run: |
          python3 -m json.tool ventas.json > /dev/null
          echo "✅ ventas.json es un JSON válido"

      - name: Configurar Python
        if: ${{ github.event.inputs.ejecutar_tests_seguridad == 'sí' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Escaneo de seguridad (claves API expuestas)
        if: ${{ github.event.inputs.ejecutar_tests_seguridad == 'sí' }}
        run: |
          python - <<'EOF'
          import re
          import sys

          # Patrones típicos de claves API (simulación)
          patrones = {
              "AWS Access Key": r"AKIA[0-9A-Z]{16}",
              "Clave tipo sk-": r"sk-[A-Za-z0-9]{20,}",
              "Token de GitHub": r"ghp_[A-Za-z0-9]{36}",
              "Campo api_key": r"(?i)api[_-]?key\"?\s*[:=]\s*\"?[A-Za-z0-9_\-]{16,}",
          }

          with open("ventas.json", encoding="utf-8") as f:
              contenido = f.read()

          hallazgos = [n for n, p in patrones.items() if re.search(p, contenido)]

          print("🔍 Escaneando ventas.json en busca de claves API expuestas...")
          if hallazgos:
              print(f"❌ Posibles secretos encontrados: {', '.join(hallazgos)}")
              sys.exit(1)
          print("✅ Escaneo completado: no se han encontrado claves expuestas")
          EOF

  # ---------------------------------------------------------------
  # JOB 2: Procesamiento (matrix staging / production)
  # ---------------------------------------------------------------
  procesamiento:
    name: Procesamiento (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    needs: ci-seguridad
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Generar reporte del entorno
        run: |
          {
            echo "REPORTE DE VENTAS - ENTORNO: ${{ matrix.entorno }}"
            echo "Fecha: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Ejecutado por: ${{ github.actor }}"
            echo "Run ID: ${{ github.run_id }}"
            echo "Registros en ventas.json: $(python3 -c 'import json; print(len(json.load(open("ventas.json"))))')"
            echo "Estado: procesamiento simulado completado"
          } > reporte_${{ matrix.entorno }}.txt
          cat reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  # ---------------------------------------------------------------
  # JOB 3: Notificación de éxito
  # ---------------------------------------------------------------
  notificacion:
    name: Notificación de éxito
    runs-on: ubuntu-latest
    needs: [ci-seguridad, procesamiento]
    if: ${{ success() }}
    steps:
      - name: Simular envío a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo "🎉 Pipeline completado con éxito"
          echo "Enviando notificación a: $DISCORD_WEBHOOK"