name: Ejercicio entregable

on:
  workflow_dispatch:
    inputs:
      run_security_tests:
        description: Ejecutar los Tests de Seguridad
        required: true
        type: choice
        options:
          - "no"
          - "si"
        default: "no"

jobs:
  ci-security:
    name: CI y Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validar ventas.json
        run: python -m json.tool ventas.json > /dev/null

      - name: Buscar claves API expuestas
        if: ${{ inputs.run_security_tests == 'si' }}
        run: python scripts/este.py

  processing:
    name: Procesar ${{ matrix.environment }}
    needs: ci-security
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Generar reporte
        run: |
          echo "Reporte de ventas - Entorno: ${{ matrix.environment }}" > reporte-${{ matrix.environment }}.txt

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.environment }}
          path: reporte-${{ matrix.environment }}.txt

  success-notification:
    name: Notificación de éxito
    needs: [ci-security, processing]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Simular notificación a Discord_Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Error: falta el secreto DISCORD_WEBHOOK"
            exit 1
          fi
          echo "Enviando notificación a Discord (URL enmascarada): $DISCORD_WEBHOOK"