name: Ejercicio Entregable

on:
  workflow_dispatch:
    inputs:
      ejecutar_test_seguridad:
        description: "¿Quieres ejecutar los tests de seguridad?"
        required: true
        type: boolean
        default: false

jobs:
  ci-seguridad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Validar que ventas.json es JSON válido
        run: python -m json.tool ventas.json > /dev/null

      - name: Ejecutar Tests de Seguridad
        if: ${{ inputs.ejecutar_test_seguridad }}
        run: python security_scan.py

  procesamiento:
    needs: ci-seguridad
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Crear reporte del entorno
        run: |
          echo "Reporte del entorno: ${{ matrix.entorno }}" > reporte-${{ matrix.entorno }}.txt
          echo "Procesamiento completado correctamente" >> reporte-${{ matrix.entorno }}.txt

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte-${{ matrix.entorno }}.txt

  notificacion-exito:
    needs: procesamiento
    runs-on: ubuntu-latest
    steps:
      - name: Simular notificación a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: echo "Notificación simulada. Webhook configurado: ${{ secrets.DISCORD_WEBHOOK != '' }}"
