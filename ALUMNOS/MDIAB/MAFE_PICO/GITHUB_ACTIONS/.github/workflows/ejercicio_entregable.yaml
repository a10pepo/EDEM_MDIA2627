name: Procesamiento seguro de ventas

on:
  workflow_dispatch:
    inputs:
      ejecutar_tests_seguridad:
        description: '¿Ejecutar los Tests de Seguridad?'
        type: choice
        required: true
        default: 'no'
        options:
          - 'si'
          - 'no'

jobs:
  ci-seguridad:
    name: CI y seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Validar ventas.json
        run: python3 -m json.tool ventas.json > /dev/null

      - name: Simular escaneo de claves API expuestas
        if: ${{ inputs.ejecutar_tests_seguridad == 'si' }}
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys

          with open('ventas.json', encoding='utf-8') as archivo:
              ventas = json.load(archivo)

          texto = json.dumps(ventas)
          patrones = [r'sk_[A-Za-z0-9]{16,}', r'AIza[0-9A-Za-z_-]{30,}']
          encontrados = [patron for patron in patrones if re.search(patron, texto)]
          if encontrados:
              print('Posible clave API expuesta en ventas.json')
              sys.exit(1)
          print('Escaneo simulado completado: no se encontraron claves API expuestas.')
          PY

  procesamiento:
    name: Procesamiento (${{ matrix.entorno }})
    needs: ci-seguridad
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Generar reporte para ${{ matrix.entorno }}
        env:
          ENTORNO: ${{ matrix.entorno }}
        run: |
          python3 - <<'PY' > "reporte_${ENTORNO}.txt"
          import json
          import os
          from datetime import datetime, timezone

          with open('ventas.json', encoding='utf-8') as archivo:
              ventas = json.load(archivo)
          total = sum(v['cantidad'] * v['precio_unitario'] for v in ventas)
          print('REPORTE DE VENTAS')
          print(f"Entorno: {os.environ['ENTORNO']}")
          print(f"Generado: {datetime.now(timezone.utc).isoformat(timespec='seconds')}")
          print(f'Registros procesados: {len(ventas)}')
          print(f'Importe total: {total:.2f} EUR')
          PY
          cat "reporte_${ENTORNO}.txt"

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt
          if-no-files-found: error

  notificacion-exito:
    name: Notificación de éxito
    needs: [ci-seguridad, procesamiento]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Simular notificación de Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo 'Pipeline completado correctamente.'
          echo "Webhook (GitHub enmascara el secreto): ${DISCORD_WEBHOOK}"
