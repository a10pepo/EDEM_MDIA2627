name: Pipeline de Datos Seguro y Automatizado

on:
  workflow_dispatch:
    inputs:
      ejecutar_seguridad:
        description: '¿Ejecutar Tests de Seguridad?'
        required: true
        default: 'sí'
        type: choice
        options:
          - 'sí'
          - 'no'

jobs:
  # JOB 1: CI & Seguridad
  ci_y_seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Validar formato de ventas.json
        run: |
          echo "Validando ventas.json..."
          python3 -m json.tool ventas.json > /dev/null
          echo "ventas.json es un JSON válido."

      - name: Escaneo de seguridad (Condicional)
        if: ${{ inputs.ejecutar_seguridad == 'sí' }}
        run: python3 security_scan.py

  # JOB 2: Procesamiento con Matrix y Artefactos
  procesamiento:
    name: Procesamiento (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    needs: ci_y_seguridad
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Generar reporte para ${{ matrix.entorno }}
        run: |
          echo "Procesando datos de ventas en entorno: ${{ matrix.entorno }}"
          echo "Reporte de ventas - Entorno: ${{ matrix.entorno }} - Fecha: $(date)" > reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  # JOB 3: Notificación de Éxito
  notificacion:
    name: Notificación de Éxito
    runs-on: ubuntu-latest
    needs: procesamiento
    steps:
      - name: Enviar notificación a Discord (Simulado)
        run: echo "Pipeline finalizado con éxito. Notificando a ${{ secrets.DISCORD_WEBHOOK }}"

