name: "Pipeline entregable"

on:
  workflow_dispatch:
    inputs:
      tests_seguridad:
        description: "¿Ejecutar los Tests de Seguridad?"
        required: true
        type: choice
        options:
          - "si"
          - "no"
        default: "si"

jobs:
  ci-seguridad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar ventas.json
        run: jq . ventas.json

      - name: Escanear API leaks
        if: inputs.tests_seguridad == 'si'
        run: python3 escaneaAPI.py

  procesamiento:
    runs-on: ubuntu-latest
    needs: ci-seguridad
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Procesamiento
        run: echo "Procesando en ${{ matrix.entorno }}" > reporte_${{ matrix.entorno }}.txt

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  notification:
    runs-on: ubuntu-latest
    needs: [ci-seguridad, procesamiento]
    if: success()
    steps:
      - name: Notificar a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: echo "Enviando notificación de éxito a $DISCORD_WEBHOOK"
