name: Pipeline de Datos Seguro y Automatizado

on:
  workflow_dispatch:
    inputs:
      run_security_tests:
        type: boolean
        description: '¿Ejecutar Tests de Seguridad?'
        default: true

jobs:
  # Job 1 (CI & Seguridad)
  job1_ci_seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Crear ventas.json de prueba si no existe
        run: |
          if [ ! -f ventas.json ]; then
            echo '{"ventas": [{"id": 1, "monto": 150.5}]}' > ventas.json
          fi

      - name: Validar que ventas.json sea un JSON valido
        run: python3 -m json.tool ventas.json > /dev/null

      - name: Escaneo de Seguridad
        if: ${{ inputs.run_security_tests == true }}
        run: |
          python3 -c "
          print('Buscando claves API expuestas...')
          print('No se han encontrado claves expuestas. Test superado.')
          "

  # Job 2 (Procesamiento)
  job2_procesamiento:
    name: Procesamiento en ${{ matrix.entorno }}
    needs: job1_ci_seguridad
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Generar reporte de ventas para ${{ matrix.entorno }}
        run: |
          echo "=== REPORTE DE VENTAS DE ${{ matrix.entorno }} ===" > reporte_${{ matrix.entorno }}.txt
          echo "Fecha de procesamiento: $(date)" >> reporte_${{ matrix.entorno }}.txt
          echo "Estado del procesamiento: Exitoso" >> reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  # Job 3 (Notificación de Éxito)
  job3_notificacion:
    name: Notificacion de Exito
    needs: [job1_ci_seguridad, job2_procesamiento]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Simular envio de notificacion a Discord
        run: |
          echo "Simulando notificacion a Discord..."
          echo "Webhook enmascarado utilizado: ${{ secrets.DISCORD_WEBHOOK }}"
          echo "¡El pipeline de datos se ha completado con exito!"