name: Ejercicio Entregable

on:
  workflow_dispatch:
    inputs:
      test_seguridad:
        description: '¿Ejecutar Tests de Seguridad?'
        required: true
        type: choice
        options:
          - 'sí'
          - 'no'

jobs:
  ci_seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      
      - name: Validar formato de ventas.json
        run: |
          echo "Validando que ventas.json es un JSON válido..."
          jq empty ventas.json || exit 1
          echo "ventas.json es válido."

      - name: Escaneo de seguridad (Python)
        if: ${{ inputs.test_seguridad == 'sí' }}
        run: |
          echo "Simulando escaneo de seguridad buscando claves API expuestas..."
          # python script_seguridad.py

  procesamiento:
    name: Procesamiento
    needs: ci_seguridad
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Generar reporte .txt para el entorno
        run: |
          echo "Generando reporte de procesamiento para ${{ matrix.entorno }}..." > reporte_${{ matrix.entorno }}.txt

      - name: Subir reportes como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  notificacion:
    name: Notificación de Éxito
    needs: [ci_seguridad, procesamiento]
    runs-on: ubuntu-latest
    steps:
      - name: Notificar por Discord
        run: |
          echo "Enviando notificación de éxito al webhook de Discord:"
          echo "${{ secrets.DISCORD_WEBHOOK }}"