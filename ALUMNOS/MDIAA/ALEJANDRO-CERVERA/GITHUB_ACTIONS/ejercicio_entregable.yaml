
name: Ejercicio Entregable

on:
  workflow_dispatch:
    inputs:
      run_security_tests:
        type: boolean
        description: Ejecutar Tests de Seguridad
        default: true

jobs:
  ci_security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que ventas.json existe
        run: ls ventas.json

      - name: Validar que ventas.json es un JSON válido
        run: python3 -m json.tool ventas.json

      - name: Tests de Seguridad
        if: ${{ inputs.run_security_tests == true }}
        run: python3 ejecutables/security_scan.py

  processing:
    runs-on: ubuntu-latest
    needs: ci_security
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Generar reporte
        run: |
          echo "Entorno: ${{ matrix.entorno }}" > reporte_${{ matrix.entorno }}.txt
          echo "Fecha: $(date)" >> reporte_${{ matrix.entorno }}.txt
          echo "Estado: procesado correctamente" >> reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  notify_success:
    runs-on: ubuntu-latest
    needs: [ci_security, processing]
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Comprobar secreto
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Falta el secreto DISCORD_WEBHOOK"
            exit 1
          fi

      - name: Simular notificación
        run: echo "Enviando notificación a $DISCORD_WEBHOOK"