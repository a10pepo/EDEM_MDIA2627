name: Ejercicio Entregable - Procesamiento de Ventas

on:
  workflow_dispatch: ## La trigger condition del workflow
    inputs:
      tests_seguridad:
        description: "¿Ejecutar los Tests de Seguridad?"
        required: true ## Hace que el input sea obligatorio
        default: "no"
        type: choice ## El tipo del input, en este caso le damos opciones
        options:
          - "si"
          - "no"

jobs:
  ci_seguridad: ## Job 1
    name: CI y Seguridad ## Nombre con el que se verá en la interfaz
    runs-on: ubuntu-latest ## Se va a ejecutar con ubuntu en la MV

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4 ## Clonamos el código del repo en la MV

      - name: Validar que ventas.json es un JSON válido
        run: | ## Varias líneas. Cada línea es un comando de terminal.
          python3 -m json.tool ventas.json > /dev/null 
          echo "ventas.json es un JSON válido"

      - name: Escaneo de seguridad (claves API expuestas)
        if: ${{ inputs.tests_seguridad == 'si' }}
        run: python3 scripts/escaneo_seguridad.py

  procesamiento: ## Job 2
    name: Procesamiento (${{ matrix.entorno }})
    runs-on: ubuntu-latest
    needs: ci_seguridad ## Necesita que el Job 1 se haya ejecutado sin fallo.

    strategy:
      matrix:
        entorno: [staging, production] ## Cada uno corre en su propia MV y en paralelo

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4 ## Cada Job tiene su propia MV. Hay que volver a clonar el repo.

      - name: Procesar ventas y generar reporte.
        run: | # falla si el archivo no existe o está vacío
          python3 scripts/generar_reporte.py ${{ matrix.entorno }}
          test -s reporte_${{ matrix.entorno }}.txt   
          echo "Reporte reporte_${{ matrix.entorno }}.txt generado correctamente"
          echo "Podrás descargarlo en la sección Artifacts al terminar el workflow"

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4 ## Creamos el artifact para que el reporte sea descargable.
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt
          retention-days: 7 ## A los 7 días se elimina

  notificacion: ## Job 3
    name: Notificación de Éxito
    runs-on: ubuntu-latest
    needs: [ci_seguridad, procesamiento] ## Necesita que Job 1 y 2 se hayan ejecutado. No paralelo.
    if: ${{ success() }} ## Solo se ejecuta si todos los jobs terminaron correctamente

    steps:
      - name: Simular envío de notificación a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} ## Disponible solo dentro de este paso.
        run: | ## Comprobación de que existe el secreto y DISCORD_WEBHOOK no está vacío. Se finaliza el workflow si existe.
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "El secreto DISCORD_WEBHOOK no está configurado"
            exit 1
          fi
          echo "📢 Enviando notificación a Discord..."
          echo "Webhook: $DISCORD_WEBHOOK"
          echo "Mensaje: El workflow '${{ github.workflow }}' ha terminado correctamente."
          echo "Tests de seguridad ejecutados: ${{ inputs.tests_seguridad }}"
          echo "Notificación enviada"