<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitorización de Trenes RENFE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #243449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 480px;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header header"
      "map sidebar";
    height: 100vh;
  }
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    letter-spacing: .2px;
  }
  header h1 span { color: var(--accent); }
  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .2s;
  }
  .dot.online { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .status b { color: var(--text); font-weight: 500; }
  #map { grid-area: map; width: 100%; height: 100%; background: #0b1220; }
  .leaflet-container { background: #0b1220; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel);
    color: var(--text);
  }
  .leaflet-popup-content { margin: 10px 12px; font-size: 12px; line-height: 1.6; }
  .leaflet-popup-content b { color: var(--accent); }
  .popup-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #fff; }
  .sidebar {
    grid-area: sidebar;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--border);
    background: var(--bg);
  }
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-bottom: 1px solid var(--border);
  }
  .panel.trains { flex: 1.1; }
  .panel.alerts { flex: 1; }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .panel-head h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin: 0;
    color: var(--muted);
    font-weight: 600;
  }
  .badge {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .filter {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }
  .filter input {
    width: 90px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  .filter input:focus { border-color: var(--accent); }
  .filter button {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .filter button:hover { background: rgba(56,189,248,.12); }
  .filter button.clear {
    border-color: var(--border);
    color: var(--muted);
  }
  .filter button.clear:hover { background: var(--panel-2); }
  .table-wrap { overflow: auto; min-height: 0; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel-2);
    color: var(--muted);
    text-align: left;
    font-weight: 600;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    z-index: 1;
  }
  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(51,65,85,.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  tbody tr:hover { background: rgba(56,189,248,.06); cursor: pointer; }
  tbody tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
  .dist { font-weight: 700; }
  .dist.d1 { color: var(--danger); }
  .dist.d2 { color: var(--warn); }
  .dist.d3 { color: var(--ok); }
  .empty, .error-msg {
    padding: 24px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .error-msg { color: var(--danger); }
  .train-id { color: var(--accent); font-weight: 600; }
  .route { color: var(--muted); }
  @media (max-width: 900px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 45vh 1fr 1fr;
      grid-template-areas:
        "header"
        "map"
        "sidebar"
        "sidebar";
      height: auto;
      min-height: 100vh;
    }
    .sidebar { border-left: none; }
    .panel.trains .table-wrap { max-height: 28vh; }
    .panel.alerts .table-wrap { max-height: 28vh; }
    #map { height: 45vh; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Monitorización <span>RENFE</span></h1>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Conectando…</span>
      <span>·</span>
      <span>Actualizado: <b id="lastUpdate">—</b></span>
    </div>
  </header>

  <div id="map"></div>

  <aside class="sidebar">
    <section class="panel alerts">
      <div class="panel-head">
        <h2>Alertas de proximidad</h2>
        <span class="badge" id="alertsCount">0</span>
        <div class="filter">
          <label for="maxDistance">Dist. máx (m)</label>
          <input type="number" id="maxDistance" min="0" step="50" placeholder="Todas">
          <button id="applyFilter" type="button">Aplicar</button>
          <button id="clearFilter" type="button" class="clear">Limpiar</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tren 1</th>
              <th>Tren 2</th>
              <th>Distancia</th>
              <th>Hora</th>
            </tr>
          </thead>
          <tbody id="alertsBody">
            <tr><td colspan="4" class="empty">Cargando alertas…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel trains">
      <div class="panel-head">
        <h2>Trenes activos</h2>
        <span class="badge" id="trainsCount">0</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Vehículo</th>
              <th>Ruta</th>
              <th>Última posición</th>
            </tr>
          </thead>
          <tbody id="trainsBody">
            <tr><td colspan="3" class="empty">Cargando trenes…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const API_BASE = "http://localhost:8000";
  const REFRESH_MS = 10000;

  const map = L.map("map", { zoomControl: true }).setView([40.2, -3.7], 6);

  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community"
  }).addTo(map);

  const trainLayer = L.layerGroup().addTo(map);
  const markers = new Map();
  let fittedOnce = false;
  let alertFilter = null;

  const els = {
    statusDot: document.getElementById("statusDot"),
    statusText: document.getElementById("statusText"),
    lastUpdate: document.getElementById("lastUpdate"),
    alertsBody: document.getElementById("alertsBody"),
    alertsCount: document.getElementById("alertsCount"),
    trainsBody: document.getElementById("trainsBody"),
    trainsCount: document.getElementById("trainsCount"),
    maxDistance: document.getElementById("maxDistance")
  };

  function setStatus(online, text) {
    els.statusDot.classList.toggle("online", online);
    els.statusDot.classList.toggle("error", !online);
    els.statusText.textContent = text;
  }

  function escapeHtml(value) {
    return String(value ?? "—").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function formatTime(value) {
    if (!value) return "—";
    const d = new Date(value);
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleString("es-ES", {
      day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  function formatDistance(m) {
    if (m == null || isNaN(Number(m))) return "—";
    const n = Number(m);
    return n >= 1000 ? n.toFixed(0) + " m (" + (n / 1000).toFixed(2) + " km)" : n.toFixed(1) + " m";
  }

  function distanceClass(m) {
    const n = Number(m);
    if (n <= 250) return "d1";
    if (n <= 750) return "d2";
    return "d3";
  }

  function popupHtml(t) {
    return `
      <div class="popup-title">${escapeHtml(t.vehicle_id)}</div>
      <div><b>vehicle_id:</b> ${escapeHtml(t.vehicle_id)}</div>
      <div><b>route_id:</b> ${escapeHtml(t.route_id)}</div>
      <div><b>trip_id:</b> ${escapeHtml(t.trip_id)}</div>
      <div><b>Posición:</b> ${Number(t.latitude).toFixed(5)}, ${Number(t.longitude).toFixed(5)}</div>
      <div><b>Hora:</b> ${escapeHtml(formatTime(t.position_timestamp || t.received_at))}</div>
    `;
  }

  async function fetchJSON(path) {
    const res = await fetch(API_BASE + path, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " en " + path);
    return res.json();
  }

  function renderTrains(trains) {
    els.trainsCount.textContent = trains.length;
    if (!trains.length) {
      els.trainsBody.innerHTML = '<tr><td colspan="3" class="empty">No hay trenes activos.</td></tr>';
      return;
    }
    const rows = trains.slice().sort((a, b) => String(a.vehicle_id).localeCompare(String(b.vehicle_id)));
    els.trainsBody.innerHTML = rows.map(t => `
      <tr data-vehicle="${escapeHtml(t.vehicle_id)}">
        <td class="train-id mono">${escapeHtml(t.vehicle_id)}</td>
        <td class="route mono">${escapeHtml(t.route_id)}</td>
        <td>${escapeHtml(formatTime(t.position_timestamp || t.received_at))}</td>
      </tr>
    `).join("");
  }

  function updateMarkers(trains) {
    const seen = new Set();
    trains.forEach(t => {
      const lat = Number(t.latitude);
      const lon = Number(t.longitude);
      if (!isFinite(lat) || !isFinite(lon)) return;
      const id = String(t.vehicle_id);
      seen.add(id);
      if (markers.has(id)) {
        const marker = markers.get(id);
        marker.setLatLng([lat, lon]);
        marker.setPopupContent(popupHtml(t));
      } else {
        const marker = L.circleMarker([lat, lon], {
          radius: 6,
          color: "#38bdf8",
          weight: 2,
          fillColor: "#0ea5e9",
          fillOpacity: 0.85
        }).addTo(trainLayer);
        marker.bindPopup(popupHtml(t));
        marker.bindTooltip(id, { direction: "top", offset: [0, -6] });
        marker.on("click", () => {
          document.querySelectorAll("#trainsBody tr").forEach(tr => tr.classList.remove("selected"));
          const row = document.querySelector(`#trainsBody tr[data-vehicle="${CSS.escape(id)}"]`);
          if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
        markers.set(id, marker);
      }
    });
    for (const [id, marker] of markers) {
      if (!seen.has(id)) {
        trainLayer.removeLayer(marker);
        markers.delete(id);
      }
    }
    if (!fittedOnce && markers.size > 0) {
      const group = L.featureGroup([...markers.values()]);
      map.fitBounds(group.getBounds().pad(0.2), { maxZoom: 8 });
      fittedOnce = true;
    }
  }

  function renderAlerts(alerts) {
    els.alertsCount.textContent = alerts.length;
    if (!alerts.length) {
      els.alertsBody.innerHTML = '<tr><td colspan="4" class="empty">No hay alertas de proximidad.</td></tr>';
      return;
    }
    els.alertsBody.innerHTML = alerts.map(a => `
      <tr>
        <td class="train-id mono">${escapeHtml(a.train_1_id)}</td>
        <td class="train-id mono">${escapeHtml(a.train_2_id)}</td>
        <td class="dist ${distanceClass(a.distance_meters)}">${escapeHtml(formatDistance(a.distance_meters))}</td>
        <td>${escapeHtml(formatTime(a.detected_at))}</td>
      </tr>
    `).join("");
  }

  function renderError(tbody, colspan, message) {
    tbody.innerHTML = `<tr><td colspan="${colspan}" class="error-msg">${escapeHtml(message)}</td></tr>`;
  }

  async function loadTrains() {
    try {
      const trains = await fetchJSON("/trains/latest");
      renderTrains(trains);
      updateMarkers(trains);
      setStatus(true, "API conectada");
    } catch (err) {
      renderError(els.trainsBody, 3, "No se pudo conectar con la API: " + err.message);
      setStatus(false, "Sin conexión con la API");
    }
  }

  async function loadAlerts() {
    const path = alertFilter != null ? "/alerts?max_distance=" + encodeURIComponent(alertFilter) : "/alerts";
    try {
      const alerts = await fetchJSON(path);
      renderAlerts(alerts);
    } catch (err) {
      renderError(els.alertsBody, 4, "No se pudieron cargar las alertas: " + err.message);
    }
  }

  async function refreshAll() {
    await Promise.all([loadTrains(), loadAlerts()]);
    els.lastUpdate.textContent = new Date().toLocaleTimeString("es-ES");
  }

  document.getElementById("applyFilter").addEventListener("click", () => {
    const raw = els.maxDistance.value.trim();
    if (raw === "") {
      alertFilter = null;
    } else {
      const n = Number(raw);
      if (!isFinite(n) || n < 0) {
        els.maxDistance.focus();
        return;
      }
      alertFilter = n;
    }
    loadAlerts();
  });

  document.getElementById("clearFilter").addEventListener("click", () => {
    els.maxDistance.value = "";
    alertFilter = null;
    loadAlerts();
  });

  els.maxDistance.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("applyFilter").click();
  });

  els.trainsBody.addEventListener("click", e => {
    const row = e.target.closest("tr[data-vehicle]");
    if (!row) return;
    const marker = markers.get(row.dataset.vehicle);
    if (marker) {
      map.setView(marker.getLatLng(), Math.max(map.getZoom(), 10), { animate: true });
      marker.openPopup();
    }
  });

  refreshAll();
  setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
