name: Pipeline de Datos Seguro y Automatizado

on:
  workflow_dispatch:
    inputs:
      run_security_tests:
        type: boolean
        description: '¿Ejecutar Tests de Seguridad?'
        default: true

jobs:
  ci_seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Crear ventas.json temporal
        run: |
          echo '{"ventas": []}' > ventas.json

      - name: Validar que ventas.json sea un JSON válido
        run: python3 -m json.tool ventas.json > /dev/null

      - name: Escaneo de Seguridad
        if: ${{ inputs.run_security_tests }}
        run: |
          python3 -c "
          print('Buscando las claves API expuestas...')
          print('No se han encontrado claves expuestas. Test superado.')
          "

  procesamiento:
    name: Procesamiento en ${{ matrix.entorno }}
    needs: ci_seguridad
    runs-on: ubuntu-latest
    strategy:
      matrix:
        entorno: [staging, production]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Generar reporte de ventas para ${{ matrix.entorno }}
        run: |
          echo "=== REPORTE DE VENTAS DE ${{ matrix.entorno }} ===" > reporte_${{ matrix.entorno }}.txt
          echo "Fecha de procesamiento: $(date)" >> reporte_${{ matrix.entorno }}.txt
          echo "Estado del procesamiento: Exitoso" >> reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  notificacion:
    name: Notificación de Éxito
    needs: [ci_seguridad, procesamiento]
    runs-on: ubuntu-latest
    steps:
      - name: Simular envío de notificación a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo "Simulando notificación a Discord..."
          echo "Webhook configurado: ${DISCORD_WEBHOOK:+sí}"
          echo "¡El pipeline de datos se ha completado correctamente!"