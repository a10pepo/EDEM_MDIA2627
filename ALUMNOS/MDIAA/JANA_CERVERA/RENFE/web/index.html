<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RENFE - Monitor de Proximidad</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
    #map { flex: 2; height: 100%; }
    #panel { flex: 1; padding: 16px; overflow-y: auto; background: #f8fafc; border-left: 1px solid #cbd5e1; }
    .alert-card { background: #fee2e2; border-left: 4px solid #dc2626; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .disclaimer { font-size: 12px; color: #64748b; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h2>Alertas de Proximidad</h2>
    <p id="stats">Cargando datos...</p>
    <div id="alerts-list"></div>
    <p class="disclaimer">Aviso: Datos operativos orientativos con posible retraso o imprecisión GPS. No constituye un sistema de seguridad ferroviaria.</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([40.4168, -3.7038], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let layerGroup = L.layerGroup().addTo(map);

    async function refresh() {
      const res = await fetch('/api/data');
      const data = await res.json();
      layerGroup.clearLayers();

      document.getElementById('stats').innerText =
        `Trenes activos: ${data.trains.length} | Alertas recientes: ${data.alerts.length}`;

      data.trains.forEach(t => {
        L.circleMarker([parseFloat(t.latitude), parseFloat(t.longitude)], { radius: 6, color: '#2563eb' })
          .bindPopup(`<b>Tren:</b> ${t.vehicle_id}<br><b>Ruta:</b> ${t.route_id || 'N/A'}`)
          .addTo(layerGroup);
      });

      const alertsDiv = document.getElementById('alerts-list');
      alertsDiv.innerHTML = data.alerts.length === 0 ? '<p>Sin alertas recientes.</p>' : '';

      data.alerts.forEach(a => {
        L.polyline([[parseFloat(a.lat_1), parseFloat(a.lon_1)], [parseFloat(a.lat_2), parseFloat(a.lon_2)]], { color: '#dc2626', weight: 3 })
          .addTo(layerGroup);

        alertsDiv.innerHTML += `
          <div class="alert-card">
            <strong>${a.vehicle_1_id} ↔ ${a.vehicle_2_id}</strong><br>
            Distancia: <b>${a.distance_meters} m</b><br>
            <small>${new Date(a.captured_at).toLocaleString()}</small>
          </div>`;
      });
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
