name: Pipeline de Ventas

on:
  workflow_dispatch:
    inputs:
      tests_seguridad:
        description: "¿Ejecutar Tests de Seguridad?"
        type: boolean
        required: true
        default: true

jobs:
  seguridad:
    name: CI y Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar JSON
        run: python3 -m json.tool ventas.json > /dev/null

      - name: Escanear claves API
        if: ${{ inputs.tests_seguridad }}
        run: python3 escaneaAPI.py

  procesamiento:
    name: Procesamiento en ${{ matrix.entorno }}
    needs: seguridad
    runs-on: ubuntu-latest

    strategy:
      matrix:
        entorno: [staging, production]

    steps:
      - name: Generar reporte
        run: echo "Procesamiento realizado en ${{ matrix.entorno }}" > reporte_${{ matrix.entorno }}.txt

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.entorno }}
          path: reporte_${{ matrix.entorno }}.txt

  notificacion:
    name: Notificación de éxito
    needs: [seguridad, procesamiento]
    runs-on: ubuntu-latest

    steps:
      - name: Simular notificación a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Error: falta configurar DISCORD_WEBHOOK"
            exit 1
          fi
          echo "Notificación enviada a Discord: ***"
