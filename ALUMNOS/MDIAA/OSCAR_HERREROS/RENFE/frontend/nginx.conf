server {
    listen 80;
    resolver 127.0.0.11 valid=10s; # DNS de Docker: re-resuelve el backend si se recrea
    location / { root /usr/share/nginx/html; index index.html; }
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }
}
