services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renfe}
      POSTGRES_USER: ${POSTGRES_USER:-renfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistencia: los datos sobreviven a `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  collector:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALERT_DISTANCE_METERS: ${ALERT_DISTANCE_METERS:-5000}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      MAX_POSITION_AGE_SECONDS: ${MAX_POSITION_AGE_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-renfe}
      DB_USER: ${POSTGRES_USER:-renfe}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-renfe}
      DB_USER: ${POSTGRES_USER:-renfe}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAX_POSITION_AGE_SECONDS: ${MAX_POSITION_AGE_SECONDS:-300}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
